spring.application.name=workation

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:workationdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# H2 console (dev convenience, no auth required per assignment scope)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Location of the seed CSV file imported on startup
workation.import.csv-path=classpath:data/workations.csv

# Allowed origin for the Angular dev server
workation.cors.allowed-origin=http://localhost:4200
